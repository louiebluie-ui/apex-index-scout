name: Execute Index Scout
on:
  workflow_dispatch:
  schedule:
    - cron: '55 12 * * 1-5'
    - cron: '45 21 * * 1-5'
    - cron: '55 13 * * 1-5'
    - cron: '45 22 * * 1-5'
permissions:
  contents: write
jobs:
  index-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          Z=$(TZ="America/Los_Angeles" date +%Z); C="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            ([ "$Z" = "PDT" ] && [ "$C" != "55 12 * * 1-5" ] && [ "$C" != "45 21 * * 1-5" ]) && exit 0
            ([ "$Z" = "PST" ] && [ "$C" != "55 13 * * 1-5" ] && [ "$C" != "45 22 * * 1-5" ]) && exit 0
          fi
          pytest -q && python3 main.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PW: ${{ secrets.ALERT_EMAIL_PW }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ && git diff --staged --quiet || (git commit -m "Update index_scout ledgers" && git pull --rebase origin main && git push)
