# cron-sync: 2026-10-27T14:51:04Z
name: Execute Index Scout
on:
  workflow_dispatch:
  schedule:
    - cron: "22 13 * * 1-5"
    - cron: "18 21 * * 1-5"

permissions:
  contents: write

jobs:
  index-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Auto-DST Pacific Time Gate (5:55 AM & 2:45 PM PT)
        id: dst_gate
        run: |
          NY_DT=$(TZ="America/New_York" date +%Y-%m-%d)
          case "$NY_DT" in 2026-11-26|2026-12-25|2027-01-01|2027-01-18|2027-02-15) echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.dst_gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.dst_gate.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
        if: steps.dst_gate.outputs.should_run == 'true'

      - run: pytest -q && python3 main.py
        if: steps.dst_gate.outputs.should_run == 'true'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PW: ${{ secrets.ALERT_EMAIL_PW }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ && git diff --staged --quiet || (git commit -m "Update index_scout ledgers" && git pull --rebase --autostash -X theirs origin main && git push)
        if: steps.dst_gate.outputs.should_run == 'true'
