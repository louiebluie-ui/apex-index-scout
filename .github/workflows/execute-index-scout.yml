name: Execute Index Scout
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-index-scout
  cancel-in-progress: false

jobs:
  index-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q && python3 main.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PW: ${{ secrets.ALERT_EMAIL_PW }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ && git diff --staged --quiet || (git commit -m "Update index_scout ledgers" && git pull --rebase --autostash -X theirs origin main && git push)
